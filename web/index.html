<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/smoco_logo_circle.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 防主题闪烁：在 React 加载前就确定 dark/light class -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('smoco-theme')
          var theme =
            saved ||
            (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          document.documentElement.classList.add(theme)
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>

    <!-- Primary Meta -->
    <title>Smoco Desktop · Windows 实时转录 + 翻译</title>
    <meta
      name="description"
      content="Windows 系统音频实时转录工具，支持 Whisper 转录 + LLM 翻译，内嵌 OpenVINO-genai Local Whisper，零联网零安装。"
    />
    <meta name="theme-color" content="#0a0a0f" />

    <!-- Open Graph -->
    <meta property="og:title" content="Smoco Desktop · Windows 实时转录 + 翻译" />
    <meta
      property="og:description"
      content="Windows 系统音频实时转录工具，支持 Whisper 转录 + LLM 翻译，内嵌 OpenVINO-genai Local Whisper。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Smoco Desktop · Windows 实时转录 + 翻译" />
    <meta
      name="twitter:description"
      content="Windows 系统音频实时转录工具，支持 Whisper + LLM 翻译，内嵌 Local Whisper。"
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Smoco Desktop",
        "applicationCategory": "MultimediaApplication",
        "applicationSubCategory": "AudioTranscription",
        "operatingSystem": "Windows 10, Windows 11",
        "description": "Windows system audio real-time transcription tool with Whisper and LLM translation. Self-contained local Whisper via OpenVINO-genai.",
        "url": "https://smoco.app",
        "downloadUrl": "https://github.com/iambitebyte/smoco-desktop/releases",
        "codeRepository": "https://github.com/iambitebyte/smoco-desktop",
        "license": "https://opensource.org/licenses/MIT",
        "inLanguage": ["zh-CN", "ja", "en"],
        "softwareVersion": "1.0.0",
        "datePublished": "2026-06-29",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
