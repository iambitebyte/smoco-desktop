[project]
name = "whisper-local-npu"
version = "0.1.0"
description = "本地 Whisper 转写器（Windows NPU，openvino-genai）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openvino-genai>=2024.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "numpy>=1.24",
]

[project.scripts]
whisper-local-npu-api = "whisper_npu_api:main"

[tool.uv]
dev-dependencies = [
    "pytest>=7",
    "httpx>=0.27",
]
