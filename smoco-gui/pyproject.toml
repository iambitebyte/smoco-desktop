[project]
name = "smoco-gui"
version = "0.1.0"
description = "Smoco Desktop GUI - 系统音频采集与实时转录"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6.0",
    "aiohttp>=3.9.0",
    "pyaudiowpatch==0.2.12.8; platform_system=='Windows'",
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "webrtcvad-wheels>=2.0.11",
    "requests>=2.31",
]

[project.scripts]
smoco-gui = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["smoco*"]

[tool.uv]
dev-dependencies = []
