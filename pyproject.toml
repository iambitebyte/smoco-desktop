[project]
name = "smoco"
version = "0.1.0"
description = "Capture system audio, chunk via VAD, stream to an abstract transcriber."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "soundfile>=0.12",
  "webrtcvad-wheels>=2.0.11",
  "aiohttp>=3.9",
  "pyaudiowpatch>=0.2.12.8; platform_system=='Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23"]
whisper = ["faster-whisper>=1.0.0"]

[project.scripts]
smoco = "smoco.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["smoco*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
